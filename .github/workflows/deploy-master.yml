name: Deploy

on:
  # Only main ships. develop is for integration and never deploys. A merge to
  # main is a push: scan runs first, then audit, then deploy, and each job
  # starts only when the one before it succeeded.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/security-malware-scan.yml

  audit:
    needs: scan
    if: ${{ needs.scan.result == 'success' }}
    uses: ./.github/workflows/audit.yml

  deploy:
    needs: audit
    if: ${{ needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image is built here, not on the server. The droplet has 1 vCPU and
      # 2 GB shared with other sites, and its system Node is 12. The image
      # brings its own Node 22, and the server only loads and runs it.
      - name: Build API image
        run: |
          TAG="${GITHUB_SHA::12}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          docker build --pull -t "buildops-api:$TAG" -t buildops-api:latest .

      # Everything below talks to the server through the `prod` SSH alias, so
      # the host, user and port live only in this block.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          missing=""
          [ -n "$SSH_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$DEPLOY_HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing SERVER_USER"
          if [ -n "$missing" ]; then
            echo "ERROR: these repository secrets are not set:$missing"
            exit 1
          fi
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host and user come from secrets, but the host key stays pinned
          # here. Whatever SERVER_HOST names must present this exact key, so a
          # wrong or hijacked host fails the connection instead of receiving
          # the build and a root session.
          # Fingerprint: SHA256:1XuhpR+9dL2Dagh2maRTNcttr6bEhIWEGNcw0szlxhw
          # If the server is rebuilt, replace the key with the output of
          #   ssh-keyscan -t ed25519 buildopbn.kazilink.online
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIOZoF0APj/t6jnfIRe14brzxWrCcmu7VBdM/iGeb0d5" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  Port 22\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}

      - name: Verify server prerequisites
        run: |
          ssh prod '
            set -euo pipefail
            mkdir -p /var/www/buildops
            command -v docker >/dev/null || { echo "ERROR: docker is not installed on the server."; exit 1; }
            docker compose version >/dev/null 2>&1 || { echo "ERROR: the docker compose plugin is not installed on the server."; exit 1; }
            if [ ! -f /var/www/buildops/.env ]; then
              echo "ERROR: /var/www/buildops/.env is missing. Copy .env.example there and fill it in. Deploy never creates or overwrites it."
              exit 1
            fi
            # Checked by name only, so the values never reach the log.
            # Only what compose needs to start PostgreSQL is checked here. The
            # production settings of the API itself (JWT_SECRET, ALLOWED_ORIGINS,
            # BILLING_PROVIDER and the Stripe keys) are left to the server. If
            # one is missing, the health check below fails and prints the error
            # from the API naming it.
            missing=""
            for key in DB_USERNAME DB_PASSWORD DB_DATABASE; do
              grep -qE "^${key}=.+" /var/www/buildops/.env || missing="$missing $key"
            done
            if [ -n "$missing" ]; then
              echo "ERROR: /var/www/buildops/.env is missing values for:$missing"
              exit 1
            fi
            chmod 600 /var/www/buildops/.env
          '

      # Streamed straight into `docker load`, so no registry is involved and
      # no credentials are needed on the server to pull.
      - name: Ship image and compose file
        run: |
          docker save "buildops-api:$IMAGE_TAG" buildops-api:latest | gzip -1 | ssh prod 'gunzip | docker load'
          scp docker-compose.prod.yml prod:/var/www/buildops/docker-compose.prod.yml

      # Compose reads .env in the project directory both for ${...} values in
      # the file and for the api container's environment. The API is published
      # on 127.0.0.1:3100 only, behind the nginx vhost.
      - name: Start the stack
        run: |
          ssh prod "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -euo pipefail
          cd /var/www/buildops
          # An earlier attempt deployed through a systemd unit. Retire it, if it
          # exists, so it cannot fight the container for port 3100.
          if systemctl cat buildops >/dev/null 2>&1; then
            systemctl disable --now buildops || true
            rm -f /etc/systemd/system/buildops.service
            systemctl daemon-reload
          fi
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          # Migrations run before the API listens, so allow time for them.
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/api/v1/health; then
              echo "Deploy complete: buildops-api:$IMAGE_TAG answering on 127.0.0.1:3100"
              # Keep the image just deployed and :latest, and drop older tags.
              docker images buildops-api --format '{{.Tag}}' \
                | grep -vxE "latest|$IMAGE_TAG" \
                | xargs -r -I{} docker rmi "buildops-api:{}" >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: the API is not answering on 127.0.0.1:3100. Container state and last log lines:"
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail 80 api
          exit 1
          REMOTE
