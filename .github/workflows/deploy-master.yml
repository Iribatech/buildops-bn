name: Deploy

on:
  # A merge to develop is a push. Scan runs first, then audit, then deploy.
  # Each job starts only when the one before it succeeded.
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/security-malware-scan.yml

  audit:
    needs: scan
    if: ${{ needs.scan.result == 'success' }}
    uses: ./.github/workflows/audit.yml

  deploy:
    needs: audit
    if: ${{ needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 10. action-setup reads `packageManager` from package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # TypeORM requires Node ^22.13 (or 20.19, or >=24.11).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY_PROD secret is not set in GitHub repository secrets."
            exit 1
          fi
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key. With checking off, anyone able to intercept the
          # connection would be handed the build and the deploy session.
          # Fingerprint: SHA256:r18DXwqWgqJHu30EHr4QJiCT9kp2AHFr3cbY8SELP+s
          # If the server is rebuilt, replace this line with the output of
          #   ssh-keyscan -p 2245 -t ed25519 109.199.96.234
          echo '[109.199.96.234]:2245 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFo4OTcpine96X54xBkoVLjfl6n1fxak5DCBoF+Il/59' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host 109.199.96.234\n  User maic\n  Port 2245\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_PROD }}

      - name: Verify server prerequisites
        run: |
          ssh maic@109.199.96.234 '
            set -euo pipefail
            mkdir -p /var/www/buildops
            test -w /var/www/buildops
            command -v node >/dev/null
            command -v pnpm >/dev/null
            if [ ! -f /var/www/buildops/.env ]; then
              echo "ERROR: /var/www/buildops/.env is missing. Copy .env.example there and fill it in. The sync will not create or overwrite it."
              exit 1
            fi
            if ! systemctl cat buildops >/dev/null 2>&1; then
              echo "ERROR: systemd unit buildops is not installed. Install deploy/buildops.service and run: systemctl enable --now buildops"
              exit 1
            fi
            # A system unit can only be restarted with root, and this runs
            # unattended, so it needs a NOPASSWD rule scoped to that one command.
            if ! sudo -n -l /usr/bin/systemctl restart buildops >/dev/null 2>&1; then
              echo "ERROR: maic cannot restart buildops without a password. As root, run:"
              echo "  echo \"maic ALL=(root) NOPASSWD: /usr/bin/systemctl restart buildops\" > /etc/sudoers.d/buildops-deploy && chmod 440 /etc/sudoers.d/buildops-deploy"
              exit 1
            fi
          '

      - name: Sync app to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='coverage' \
            --exclude='coverage-e2e' \
            --exclude='.resets' \
            ./ maic@109.199.96.234:/var/www/buildops/

      - name: Install production dependencies and restart
        run: |
          ssh maic@109.199.96.234 '
            set -euo pipefail
            cd /var/www/buildops
            pnpm install --frozen-lockfile --prod
            sudo -n /usr/bin/systemctl restart buildops
            sleep 3
            if ! systemctl is-active --quiet buildops; then
              echo "ERROR: buildops did not stay up after the restart. Last log lines:"
              journalctl -u buildops -n 40 --no-pager 2>/dev/null || true
              exit 1
            fi
            echo "Deploy complete"
          '
