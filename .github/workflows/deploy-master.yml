name: Deploy

on:
  # Only main ships. develop is for integration and never deploys. A merge to
  # main is a push: scan runs first, then audit, then deploy, and each job
  # starts only when the one before it succeeded.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/security-malware-scan.yml

  audit:
    needs: scan
    if: ${{ needs.scan.result == 'success' }}
    uses: ./.github/workflows/audit.yml

  deploy:
    needs: audit
    if: ${{ needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 10. action-setup reads `packageManager` from package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # TypeORM requires Node ^22.13 (or 20.19, or >=24.11).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build

      # Everything below talks to the server through the `prod` SSH alias, so
      # the host, user and port live only in this block.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          missing=""
          [ -n "$SSH_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$DEPLOY_HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing SERVER_USER"
          if [ -n "$missing" ]; then
            echo "ERROR: these repository secrets are not set:$missing"
            exit 1
          fi
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host and user come from secrets, but the host key stays pinned
          # here. Whatever SERVER_HOST names must present this exact key, so a
          # wrong or hijacked host fails the connection instead of receiving
          # the build and a root session.
          # Fingerprint: SHA256:1XuhpR+9dL2Dagh2maRTNcttr6bEhIWEGNcw0szlxhw
          # If the server is rebuilt, replace the key with the output of
          #   ssh-keyscan -t ed25519 buildopbn.kazilink.online
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIOZoF0APj/t6jnfIRe14brzxWrCcmu7VBdM/iGeb0d5" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  Port 22\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}

      - name: Verify server prerequisites
        run: |
          ssh prod '
            set -euo pipefail
            mkdir -p /var/www/buildops
            command -v node >/dev/null || { echo "ERROR: node is not installed on the server (Node 22.13+ is required)."; exit 1; }
            command -v pnpm >/dev/null || { echo "ERROR: pnpm is not installed on the server. Run: corepack enable pnpm"; exit 1; }
            if [ ! -f /var/www/buildops/.env ]; then
              echo "ERROR: /var/www/buildops/.env is missing. Copy .env.example there and fill it in. The sync will not create or overwrite it."
              exit 1
            fi
          '

      - name: Sync app to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='coverage' \
            --exclude='coverage-e2e' \
            --exclude='.resets' \
            ./ prod:/var/www/buildops/

      # The unit ships with the repo, so a change to it deploys like any other
      # file. It pins the API to port 3100: port 3000 on this server belongs to
      # another app, and nginx proxies the domain to 127.0.0.1:3100.
      - name: Install production dependencies and restart
        run: |
          ssh prod '
            set -euo pipefail
            cd /var/www/buildops
            pnpm install --frozen-lockfile --prod
            install -m 644 deploy/buildops.service /etc/systemd/system/buildops.service
            systemctl daemon-reload
            systemctl enable --quiet buildops
            systemctl restart buildops
            # Migrations run on boot, so give the API time to come up before
            # deciding it failed.
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3100/api/v1/plans; then
                echo "Deploy complete: API answering on 127.0.0.1:3100"
                exit 0
              fi
              systemctl is-active --quiet buildops || break
              sleep 2
            done
            echo "ERROR: buildops is not answering on 127.0.0.1:3100. Last log lines:"
            journalctl -u buildops -n 60 --no-pager 2>/dev/null || true
            exit 1
          '
